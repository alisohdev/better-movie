name: Preview workflow checks
on:
  pull_request:
    paths:
      - '.github/workflows/preview-*.yml'
      - 'scripts/ci/**'
      - 'tests/ci/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/preview-*.yml'
      - 'scripts/ci/**'
      - 'tests/ci/**'
permissions:
  contents: read
jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s tests/ci -v
