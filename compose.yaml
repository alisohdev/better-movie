services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: movie
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: movie_discovery
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - movie-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie -d movie_discovery"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  movie-postgres:
